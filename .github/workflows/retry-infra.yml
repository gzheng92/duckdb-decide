name: Retry infrastructure failures
# DuckDB's build tools rebuild their Linux Docker image on every run, and that
# image downloads packages from public mirrors without retrying. When a failed
# run's log shows a mirror or network outage, re-run the failed jobs once.
# Failures without a known outage message, and repeat failures, are left alone.
# GitHub only runs workflow_run workflows from the default branch's copy.
on:
  workflow_run:
    workflows: [Build and test, Community distribution compatibility, Release]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Look for a known outage in the failure logs
        id: scan
        run: |
          # Logs can take a moment to become available after a run completes.
          for attempt in 1 2 3; do
            gh run view "$RUN_ID" --log-failed > failed.log 2>/dev/null && [ -s failed.log ] && break
            sleep 15
          done
          pattern='Failed to download metadata for repo|Cannot download repomd\.xml|All mirrors were tried'
          pattern="$pattern|Could not resolve host|Temporary failure in name resolution"
          pattern="$pattern|Connection reset by peer|TLS handshake timeout|Connection timed out"
          if grep -Eq "$pattern" failed.log; then
            echo "Known infrastructure error found:"
            grep -Em5 "$pattern" failed.log
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "No known infrastructure error in the failure logs; not retrying."
          fi
      - name: Re-run failed jobs
        if: steps.scan.outputs.retry == 'true'
        run: gh run rerun "$RUN_ID" --failed
