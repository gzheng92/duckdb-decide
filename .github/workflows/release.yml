name: Release
# Releases this branch's DuckDB line: build and test every supported platform,
# then publish the binaries as a GitHub Release. Start it from the Actions tab on
# the release branch (v1.x or v2.x), or push a tag matching the branch's version.
# See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:  # releases the selected branch's current version
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.line.outputs.tag }}
      duckdb_version: ${{ steps.line.outputs.duckdb_version }}
      latest: ${{ steps.line.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against release line
        id: line
        run: |
          source release.env
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            [ "$GITHUB_REF_NAME" = "$RELEASE_BRANCH" ] || { echo "Run releases from $RELEASE_BRANCH, not $GITHUB_REF_NAME" >&2; exit 1; }
            tag=v$(sed -n 's/.*EXTENSION_VERSION \([0-9][0-9.]*\).*/\1/p' extension_config.cmake)
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already released; bump the version first" >&2; exit 1
            fi
          fi
          ./scripts/check_release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "duckdb_version=$DUCKDB_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: decide
      exclude_archs: "osx_amd64;wasm_mvp;wasm_eh;wasm_threads"

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      DUCKDB_VERSION: ${{ needs.check.outputs.duckdb_version }}
      LATEST: ${{ needs.check.outputs.latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: decide-${{ needs.check.outputs.duckdb_version }}-extension-*
      - name: Collect binaries
        run: |
          # DuckDB derives an extension's entry point from its file name, so the binary
          # must stay decide.duckdb_extension. Each platform ships as a zip holding it.
          mkdir dist staging
          prefix="decide-$DUCKDB_VERSION-extension-"
          for dir in artifacts/"$prefix"*; do
            platform=${dir#artifacts/$prefix}
            files=$(find "$dir" -name '*.duckdb_extension')
            [ "$(echo "$files" | grep -c .)" = 1 ] || { echo "expected one binary in $dir" >&2; exit 1; }
            package="decide-$TAG-duckdb-$DUCKDB_VERSION-$platform"
            mkdir "staging/$package"
            cp "$files" "staging/$package/decide.duckdb_extension"
            (cd "staging/$package" && zip -q -X "../../dist/$package.zip" decide.duckdb_extension)
          done
          ls dist | grep -q . || { echo "no binaries were built" >&2; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Publish release
        run: |
          cat > notes.md <<NOTES
          Built for **DuckDB $DUCKDB_VERSION**. DuckDB loads an extension only into the
          version it was built for. For another DuckDB release, use the matching line in the
          [compatibility table](https://github.com/$GITHUB_REPOSITORY#duckdb-compatibility).

          Download the zip for your platform and unzip it. It contains
          \`decide.duckdb_extension\`. Keep that file name: DuckDB derives the extension's
          entry point from it, so a renamed file fails to load.

          \`\`\`sql
          -- start DuckDB with -unsigned (CLI) or allow_unsigned_extensions=true
          LOAD 'path/to/decide.duckdb_extension';
          \`\`\`

          Verify downloads with \`SHA256SUMS\`.
          NOTES
          # A tag push already has the tag; a manual run creates it at the built commit.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "decide $TAG for DuckDB $DUCKDB_VERSION" --notes-file notes.md \
            --latest="$LATEST"
