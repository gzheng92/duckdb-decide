name: Community distribution compatibility
on:
  push:
    branches: ['**']  # release tags build in release.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: decide
      exclude_archs: "osx_amd64;wasm_mvp;wasm_eh;wasm_threads"
